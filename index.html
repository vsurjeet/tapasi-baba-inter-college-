<title>तपसी बाबा इंटर कॉलेज</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700&family=Tiro+Devanagari+Hindi&display=swap">
<style>
/* Layout: sticky header with logo + wrapped nav; one-column content, 1080px measure; navy hero with the logo as its anchor */
:root{
  --bg:#f4f7fc; --surface:#ffffff; --ink:#14213d; --muted:#556385; --line:#d9e1f0;
  --blue:#1d4f9c; --blue-ink:#ffffff; --navy:#0f2547; --navy-ink:#f1f5fd;
  --maroon:#6e1f24; --gold:#c8941a; --good:#17803d; --good-bg:#e4f4ea; --bad:#b3261e; --bad-bg:#fbe8e6; --warn-bg:#fff4d6;
  --f-display:"Tiro Devanagari Hindi","Noto Serif Devanagari",Georgia,serif;
  --f-body:"Mukta","Noto Sans Devanagari","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1322; --surface:#121c33; --ink:#e7edf9; --muted:#9dabc9; --line:#25334f;
  --blue:#6fa1f2; --blue-ink:#08142b; --navy:#0a1730; --navy-ink:#eef3fd;
  --maroon:#e8959b; --gold:#e2b341; --good:#5fd08a; --good-bg:#12301f; --bad:#ff8f87; --bad-bg:#3a1a19; --warn-bg:#3a3012; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1322; --surface:#121c33; --ink:#e7edf9; --muted:#9dabc9; --line:#25334f;
  --blue:#6fa1f2; --blue-ink:#08142b; --navy:#0a1730; --navy-ink:#eef3fd;
  --maroon:#e8959b; --gold:#e2b341; --good:#5fd08a; --good-bg:#12301f; --bad:#ff8f87; --bad-bg:#3a1a19; --warn-bg:#3a3012; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;padding-inline:0}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.25;text-wrap:balance;margin:0}
p{margin:0}
a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1080px;margin-inline:auto;padding-inline:16px}
.page{padding-block:28px 56px;display:flex;flex-direction:column;gap:28px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;text-align:left;min-width:0}
.brand img{width:46px;height:46px;border-radius:50%;flex:none}
.brand b{font-family:var(--f-display);font-weight:400;font-size:1.18rem;color:var(--ink);display:block;line-height:1.15}
.brand small{color:var(--muted);font-size:.8rem;display:block}
.menu-btn{margin-left:auto;display:none;background:var(--blue);color:var(--blue-ink);border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}
.nav{display:flex;flex-wrap:wrap;gap:2px 4px;padding-bottom:8px}
.nav button{background:none;border:0;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:.95rem;font-weight:600;color:var(--muted)}
.nav button:hover{background:var(--bg);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--blue);color:var(--blue-ink)}
.nav button.cta{border:2px solid var(--gold);color:var(--ink)}
@media(max-width:860px){
  .menu-btn{display:block}
  .nav{display:none;flex-direction:column;padding-bottom:12px}
  body.menu-open .nav{display:flex}
  .nav button{text-align:left;padding:11px 12px}
}
.hero{background:var(--navy);color:var(--navy-ink)}
.hero .wrap{display:grid;grid-template-columns:1.25fr .75fr;gap:32px;align-items:center;padding-block:44px}
.hero h1{font-size:clamp(2rem,5.4vw,3.4rem)}
.eyebrow{font-size:.92rem;letter-spacing:.04em;color:var(--gold);font-weight:600;margin-bottom:6px}
.hero .lead{font-size:1.3rem;margin-top:14px}
.hero .tag{margin-top:6px;color:var(--gold);font-weight:700;letter-spacing:.06em}
.hero .logo{width:min(300px,100%);aspect-ratio:1;border-radius:50%;justify-self:center;border:5px solid var(--gold);background:#fff}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 20px;border-radius:10px;border:2px solid var(--blue);background:var(--blue);color:var(--blue-ink);font-weight:700;cursor:pointer;text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--blue)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1b1405}
.btn.light{background:transparent;border-color:#fff;color:#fff}
.btn.sm{min-height:36px;padding:4px 12px;font-size:.92rem}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
@media(max-width:760px){.hero .wrap{grid-template-columns:1fr}.hero .logo{order:-1;width:170px}}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.fact b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.9rem;color:var(--blue);line-height:1.15}
.fact span{color:var(--muted);font-size:.95rem}
.sec>h2{font-size:1.65rem;margin-bottom:6px}
.sec>.sub{color:var(--muted);margin-bottom:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.grid>*{min-width:0}
.feat{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.feat i{flex:none;width:10px;height:10px;border-radius:50%;background:var(--gold);margin-top:9px}
.msg{background:var(--navy);color:var(--navy-ink);border-radius:14px;padding:22px;font-family:var(--f-display);font-size:1.25rem;line-height:1.5}
.two{display:grid;gap:20px;grid-template-columns:1fr 1fr}
.two>*{min-width:0}
@media(max-width:760px){.two{grid-template-columns:1fr}}
.princ{display:grid;grid-template-columns:200px 1fr;gap:22px;align-items:start}
.princ img{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:center top;border-radius:12px;border:1px solid var(--line)}
@media(max-width:560px){.princ{grid-template-columns:1fr}.princ img{max-width:220px}}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--line);font-size:.82rem;font-weight:600;color:var(--muted)}
.pill.board{background:var(--warn-bg);border-color:var(--gold);color:var(--ink)}
.notice{border-left:4px solid var(--gold);padding:10px 14px;background:var(--surface);border-radius:0 10px 10px 0;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.notice small{color:var(--muted)}
.disc{background:var(--warn-bg);border:1px solid var(--gold);border-radius:12px;padding:12px 16px;font-size:.94rem}
.empty{border:2px dashed var(--line);border-radius:14px;padding:26px;text-align:center;color:var(--muted)}
form.f{display:grid;gap:14px;grid-template-columns:1fr 1fr}
form.f .full{grid-column:1/-1}
@media(max-width:620px){form.f{grid-template-columns:1fr}}
label{display:grid;gap:4px;font-weight:600;font-size:.95rem;min-width:0}
input,select,textarea{width:100%;min-height:44px;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);font-weight:400}
textarea{min-height:90px;resize:vertical}
input[type=checkbox],input[type=radio]{width:auto;min-height:0}
.steps{display:flex;gap:6px;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
.steps b{color:var(--blue)}
.choice{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.choice button{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:16px;text-align:left;cursor:pointer;font-weight:700;font-size:1.05rem}
.choice button:hover{border-color:var(--blue)}
.choice small{display:block;color:var(--muted);font-weight:400}
.testrow{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.testrow>div{min-width:0}
.runbar{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--navy);color:var(--navy-ink);border-radius:12px;padding:12px 16px;flex-wrap:wrap}
.runbar span{display:block;font-size:.88rem;opacity:.85}
.timer{font-family:var(--f-body);font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.12);padding:2px 14px;border-radius:8px}
.timer.low{background:var(--bad);color:#fff}
.runbody{display:grid;grid-template-columns:1fr 250px;gap:18px;align-items:start}
.runbody>*{min-width:0}
@media(max-width:800px){.runbody{grid-template-columns:1fr}}
.qno{color:var(--muted);font-weight:600;margin-bottom:6px}
.qtext{font-size:1.3rem;margin-bottom:16px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;min-height:52px}
.opt:hover{border-color:var(--blue)}
.opt.sel{border-color:var(--blue);background:var(--surface);box-shadow:inset 0 0 0 1px var(--blue)}
.ol{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-weight:700;font-size:.9rem}
.opt.sel .ol{background:var(--blue);color:var(--blue-ink)}
.runnav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.qnav .qg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0 14px}
.qn{min-height:40px;border-radius:8px;border:2px solid var(--line);background:var(--bg);font-weight:700;cursor:pointer}
.qn.done{background:var(--good-bg);border-color:var(--good)}
.qn.cur{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue)}
.confirm{margin-top:12px;background:var(--warn-bg);border:1px solid var(--gold);border-radius:10px;padding:10px;display:grid;gap:8px}
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.score div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.score b{display:block;font-size:1.4rem;font-variant-numeric:tabular-nums}
.score span{font-size:.85rem;color:var(--muted)}
.rev{border-left:5px solid var(--line);padding:12px 14px;background:var(--surface);border-radius:0 12px 12px 0;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.rev.ok{border-left-color:var(--good)}
.rev.no{border-left-color:var(--bad)}
.rev.sk{border-left-color:var(--gold)}
.rev p+p{margin-top:4px}
.tag-ok{color:var(--good);font-weight:700}.tag-no{color:var(--bad);font-weight:700}
.bars{display:grid;gap:10px}
.bar-row{display:grid;grid-template-columns:140px 1fr 56px;gap:10px;align-items:center;font-size:.95rem}
.bar-row .track{height:12px;background:var(--bg);border-radius:99px;border:1px solid var(--line);overflow:hidden}
.bar-row .fill{height:100%;background:var(--blue)}
.bar-row b{font-variant-numeric:tabular-nums;text-align:right}
.tablebox{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:.93rem}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--bg);font-size:.82rem;letter-spacing:.03em;color:var(--muted)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 14px;font-weight:600;cursor:pointer}
.tabs button[aria-current="true"]{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.list{display:grid;gap:10px}
.item{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;flex-wrap:wrap}
.item>div:first-child{min-width:0;flex:1 1 240px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.chk{max-height:260px;overflow:auto;border:1.5px solid var(--line);border-radius:10px;padding:8px;display:grid;gap:6px;background:var(--bg)}
.chk label{display:flex;gap:8px;align-items:flex-start;font-weight:400}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.gal figure{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.gal figcaption{padding:8px 12px;font-size:.92rem}
.avatar{width:76px;height:76px;border-radius:50%;background:var(--navy);color:var(--navy-ink);display:grid;place-items:center;font-weight:700;flex:none}
.person{display:flex;gap:12px;align-items:center}
.person{align-items:flex-start}.person img{width:76px;height:76px;border-radius:50%;object-fit:cover;object-position:center top;flex:none;border:2px solid var(--line)}.pinfo{min-width:0;display:grid;gap:2px}.pinfo i{font-style:normal;color:var(--ink);font-weight:600}.thumb{width:44px;height:44px;border-radius:50%;object-fit:cover;object-position:center top;flex:none}
.person b{display:block;line-height:1.3}
.person span{color:var(--muted);font-size:.93rem;overflow-wrap:anywhere}
footer{background:var(--navy);color:var(--navy-ink);padding-block:28px;font-size:.93rem}
footer .wrap{display:grid;gap:10px}
footer a{color:var(--gold)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:50;font-weight:600;max-width:90vw;text-align:center}
.muted{color:var(--muted)}
.ic{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;color:#fff;flex:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{display:flex;flex-direction:column;gap:14px}
@media(prefers-reduced-motion:no-preference){.page{animation:in .25s ease-out}@keyframes in{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>

function doPush(){

 if(CL.pushing){CL.again=true;return}

  Object.keys(CL.synced).forEach(function(p){if(!(p in wd.w)&&!(p in wd.ro))ops.push({p:p,del:1})})}
 else{Object.keys(wd.ro).forEach(function(p){if(!(p in CL.synced)){var d=plain(wd.ro[p]);ops.push({p:p,d:d,c:cj(d)})}})}
 if(!ops.length)return;
 CL.pushing=true;setStat("सहेज रहे हैं…");
 var chunks=[];for(var i=0;i<ops.length;i+=300)chunks.push(ops.slice(i,i+300));
 chunks.reduce(function(pr,ch){return pr.then(function(){var b=CL.db.batch();ch.forEach(function(o){var ref=CL.db.doc(o.p);if(o.del)b.delete(ref);else b.set(ref,o.d)});return b.commit().then(function(){ch.forEach(function(o){if(o.del)delete CL.synced[o.p];else CL.synced[o.p]=o.c})})})},Promise.resolve()).then(function(){CL.pushing=false;CL.init=CL.init||CL.role==="admin";setStat("✓ ऑनलाइन सहेजा गया");if(CL.again){CL.again=false;queuePush()}},function(e){CL.pushing=false;setStat("⚠ सहेजा नहीं जा सका: "+errText(e));toast("ऑनलाइन सहेजा नहीं जा सका: "+errText(e))})}

function startTest(t,stu){
